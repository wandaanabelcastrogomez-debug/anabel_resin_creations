
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Login - Anabel Resin Creations</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f8f0ff;
    text-align: center;
    margin: 0;
    padding: 50px;
}

.login {
    background-color: white;
    width: 350px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid #d8b4fe;
    box-shadow: 0px 5px 15px #cccccc;
}

h1 {
    color: #7b2cbf;
}

h2 {
    color: #7b2cbf;
    font-size: 28px;
    margin-bottom: 25px;
}

.inputbox {
    margin-bottom: 20px;
}

.inputbox input {
    width: 90%;
    padding: 12px;
    border: 2px solid #c77dff;
    border-radius: 8px;
    font-size: 16px;
}

.inputbox input:focus {
    border-color: #7b2cbf;
    outline: none;
}

.mi-boton1 {
    background-color: #7b2cbf;
    color: white;
    border: none;
    padding: 12px 35px;
    margin-top: 20px;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

.mi-boton1:hover {
    background-color: #5a189a;
}

.group {
    margin-top: 25px;
}

.group a {
    display: block;
    color: #7b2cbf;
    text-decoration: none;
    margin: 10px;
    font-size: 16px;
}

.group a:hover {
    color: #3c096c;
    text-decoration: underline;
}

</style>

</head>

<body>

<center>

<h1>ANABEL RESIN CREATIONS</h1>

<div class="login">

<h2>Usuario</h2>

<div class="inputbox">
<input type="text" placeholder="Usuario">
</div>

<div class="inputbox">
<input type="password" placeholder="Password">
</div>

<a href="pago.html">
<button class="mi-boton1">Entrar</button>
</a>

</div>

<div class="group">

<a href="login.html">¿Olvidaste la contraseña?</a>

<a href="formulario-de-registro.html">Crear usuario</a>

</div>

</center>

</body>

</html>
