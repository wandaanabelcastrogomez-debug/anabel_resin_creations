
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Crear Usuario - Anabel Resin Creations</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f8f0ff;
    text-align: center;
    margin: 0;
    padding: 30px;
}

.login {
    background-color: white;
    width: 400px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid #d8b4fe;
    box-shadow: 0px 5px 15px #cccccc;
}

h1 {
    color: #7b2cbf;
}

h2 {
    color: #7b2cbf;
    font-size: 28px;
    margin-bottom: 25px;
}

.inputbox {
    margin-bottom: 18px;
}

.inputbox label {
    display: block;
    color: #5a189a;
    font-weight: bold;
    margin-bottom: 7px;
}

.inputbox input {
    width: 90%;
    padding: 11px;
    border: 2px solid #c77dff;
    border-radius: 8px;
    font-size: 16px;
}

.inputbox input:focus {
    border-color: #7b2cbf;
    outline: none;
}

select {
    width: 90%;
    padding: 11px;
    border: 2px solid #c77dff;
    border-radius: 8px;
    font-size: 16px;
    margin-top: 8px;
}

select:focus {
    border-color: #7b2cbf;
    outline: none;
}

label {
    color: #5a189a;
    font-weight: bold;
}

.mi-boton1 {
    background-color: #7b2cbf;
    color: white;
    border: none;
    padding: 12px 25px;
    margin: 10px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.mi-boton1:hover {
    background-color: #5a189a;
}

</style>

</head>

<body>

<center>

<h1>ANABEL RESIN CREATIONS</h1>

<div class="login">

<h2>Crear Usuario</h2>

<div class="inputbox">
<label>Nombre</label>
<input type="text" placeholder="Nombre">
</div>

<div class="inputbox">
<label>Apellido</label>
<input type="text" placeholder="Apellido">
</div>

<div class="inputbox">
<label>Correo</label>
<input type="text" placeholder="alguien@email.com">
</div>

<div class="inputbox">
<label>Número</label>
<input type="text" placeholder="809 xxx xxx">
</div>

<div class="inputbox">
<label>Contraseña</label>
<input type="password" placeholder="Password">
</div>

<div class="inputbox">

<label for="sexo">Elija el sexo</label>

<select name="sexo" id="sexo">

<option value="">Elija el sexo</option>
<option value="femenino">Femenino</option>
<option value="masculino">Masculino</option>
<option value="prefiero-no-decirlo">Prefiero no decirlo</option>

</select>

</div>

<div class="inputbox">

<label for="edad">Elija la edad</label>

<select name="edad" id="edad">

<option value="">Elija la edad</option>
<option value="22">22</option>
<option value="23">23</option>
<option value="24">24</option>
<option value="25">25</option>
<option value="26">26</option>
<option value="27">27</option>

</select>

</div>

<a href="menu.html">
<button class="mi-boton1">Entrar</button>
</a>

<a href="login.html">
<button class="mi-boton1">Usuario</button>
</a>

</div>

</center>

</body>

</html>
